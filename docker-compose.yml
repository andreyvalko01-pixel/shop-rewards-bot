services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rewards
      POSTGRES_PASSWORD: rewards
      POSTGRES_DB: rewards
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    env_file: .env
    depends_on: [db]
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    command: uvicorn webadmin.app:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    depends_on: [db]

volumes:
  pgdata:
